<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>Detalle de proyecto | Julio García Carballo</title>
    <meta name="description" content="Aplicaciones móviles y de TV desarrolladas por Julio García Carballo.">
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        // Apply before first paint. Storage may be unavailable in private browsers.
        (() => {
            let theme;
            try { theme = localStorage.getItem('portfolio-theme'); } catch {}
            if (theme !== 'light' && theme !== 'dark') {
                theme = window.matchMedia?.('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }
            document.documentElement.dataset.theme = theme;
        })();
    </script>
    <link rel="stylesheet" href="./style.css?v=20261119-5">
    <link rel="stylesheet" href="./project.css?v=20261119-4">
    <script src="./shared.js?v=20261119-4" defer></script>
    <script src="./project.js?v=20261119-4" defer></script>
</head>
<body class="detail-page">
    <a class="skip-link" href="#main">Saltar al contenido</a>
    <header class="top-bar">
        <a class="brand" href="./index.html#perfil" aria-label="Julio García, inicio">JG<span>.</span></a>
        <nav aria-label="Navegación principal"><a href="./index.html#proyectos">Volver a proyectos</a></nav>
        <button id="themeButton" class="theme-button" type="button" aria-label="Activar modo oscuro" aria-pressed="false">
            <svg class="icon sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg>
            <svg class="icon moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M20 15.5A8.5 8.5 0 0 1 8.5 4 8.5 8.5 0 1 0 20 15.5Z"/></svg>
        </button>
    </header>
    <main id="main" class="container" tabindex="-1" aria-busy="true">
        <noscript><div class="card detail-state"><h1>Detalle de proyecto</h1><p>Activa JavaScript para ver la información y las capturas del proyecto.</p><a class="button button-primary" href="./index.html#proyectos">Volver a proyectos</a></div></noscript>
        <section id="projectState" class="card detail-state" aria-labelledby="stateTitle" role="status">
            <p class="eyebrow">Proyectos seleccionados</p>
            <h1 id="stateTitle">Cargando proyecto…</h1>
            <p id="stateMessage">Estamos preparando la información y las capturas.</p>
            <div class="detail-actions"><a class="button button-primary" href="./index.html#proyectos">Volver a proyectos</a><button id="detailRetry" class="button secondary-action" type="button" hidden>Volver a intentar</button></div>
        </section>
        <div id="detailContent" class="detail-layout" hidden></div>
    </main>
    <footer class="footer"><span>Julio García Carballo</span><span>Desarrollo móvil · Android, iOS & TV</span></footer>
    <dialog id="lightbox" class="lightbox" aria-labelledby="lightboxTitle" aria-describedby="lightboxHelp">
        <div class="lightbox-top"><div><h2 id="lightboxTitle">Captura del proyecto</h2><p id="lightboxHelp">Usa las flechas para navegar y Escape para cerrar.</p></div><button id="lightboxClose" class="lightbox-control" type="button" aria-label="Cerrar vista ampliada" autofocus><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg></button></div>
        <div class="lightbox-stage">
            <button id="lightboxPrevious" class="lightbox-control" type="button" aria-label="Captura anterior"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg></button>
            <figure class="lightbox-figure"><div id="lightboxImageFrame" class="lightbox-image-frame"><p id="lightboxImageState" role="status">Cargando captura…</p></div></figure>
            <button id="lightboxNext" class="lightbox-control" type="button" aria-label="Captura siguiente"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg></button>
        </div>
        <p id="lightboxCounter" class="lightbox-counter" aria-live="polite"></p>
    </dialog>
</body>
</html>
